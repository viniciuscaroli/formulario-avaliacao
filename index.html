<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Formulário de avaliação domiciliar</title>
<style>
/* dois toques rapidos nao dao zoom (21/10/2026); a pinca continua valendo */
html,body,button,a,input,select,textarea,label{touch-action:manipulation}

:root{--papel:#fbfaf7;--cartao:#fff;--tinta:#1d2420;--apagado:#6b746f;--linha:#d9dcd6;--verde:#2f8f5b;--erro:#b3413b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--papel:#141816;--cartao:#1c211e;--tinta:#e8ece9;--apagado:#9aa49e;--linha:#333b36;--verde:#4fb47d;--erro:#e0736b}}
:root[data-theme="dark"]{--papel:#141816;--cartao:#1c211e;--tinta:#e8ece9;--apagado:#9aa49e;--linha:#333b36;--verde:#4fb47d;--erro:#e0736b}
#tm{position:fixed;top:14px;right:14px;width:36px;height:36px;margin:0;padding:0;border-radius:50%;display:grid;place-items:center;
  background:var(--cartao);border:1px solid var(--linha);color:var(--apagado);cursor:pointer}
#tm:hover{color:var(--tinta);border-color:var(--verde)}
#tm svg{width:16px;height:16px;display:block}
#tm .e{display:none}
:root[data-theme="dark"] #tm .c{display:none} :root[data-theme="dark"] #tm .e{display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #tm .c{display:none} :root:not([data-theme="light"]) #tm .e{display:block}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--papel);color:var(--tinta);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
form{width:100%;max-width:420px;background:var(--cartao);border:1px solid var(--linha);border-radius:16px;padding:28px 24px}
h1{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
p{margin:0 0 18px;color:var(--apagado);font-size:14.5px}
label{display:block;font-size:13px;font-weight:650;margin:14px 0 6px}
input,textarea{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--linha);border-radius:10px;background:var(--papel);color:var(--tinta)}
textarea{font-size:16px;height:92px;resize:vertical;font-family:ui-monospace,monospace}
input,textarea,select{font-size:16px}
input.pin{font-size:20px;letter-spacing:.14em;text-transform:uppercase;font-family:ui-monospace,monospace}
input:focus,textarea:focus{outline:2px solid var(--verde);outline-offset:1px}
.arq{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--apagado)}
.arq button{width:auto;margin:0;padding:9px 14px;background:none;border:1px solid var(--linha);color:var(--tinta);font-weight:600}
.arq span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{width:100%;margin-top:18px;border:0;border-radius:10px;padding:13px;font:inherit;font-weight:700;background:var(--verde);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.erro{color:var(--erro);font-size:14px;min-height:1.3em;margin:10px 0 0}
.troca{display:block;margin-top:14px;font-size:13.5px;color:var(--apagado);text-align:center;background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;width:100%;font-weight:400}
[hidden]{display:none !important}
</style></head><body>
<button type="button" id="tm" title="Trocar entre claro e escuro" aria-label="Trocar entre claro e escuro"><span class="c"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.2 11.6A6.6 6.6 0 0 1 8.4 3.8a6.8 6.8 0 1 0 7.8 7.8z"/></svg></span><span class="e"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="3.6"/><path d="M10 2.4v1.6M10 16v1.6M17.6 10H16M4 10H2.4M15.4 4.6l-1.1 1.1M5.7 14.3l-1.1 1.1M15.4 15.4l-1.1-1.1M5.7 5.7 4.6 4.6"/></svg></span></button>
<form id="f" autocomplete="off">
  <h1>Formulário de avaliação</h1>
  <div id="mArq">
    <p>Use o arquivo que você recebeu por e-mail e o PIN que chegou por outro caminho.</p>
    <label>Arquivo da avaliação</label>
    <div class="arq"><button type="button" id="ba">Escolher o arquivo</button><span id="na">nenhum escolhido</span></div>
    <input type="file" id="fa" accept=".txt,text/plain" hidden>
    <label for="tx">ou cole o texto do arquivo</label>
    <textarea id="tx" spellcheck="false" placeholder="começa com AVALIACAO1."></textarea>
    <label for="pin">PIN</label>
    <input id="pin" class="pin" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX">
  </div>
  <div id="mCod" hidden>
    <p>Digite o código de acesso que você recebeu.</p>
    <label for="c">Código de acesso</label>
    <input id="c" class="pin" autocomplete="off" autocapitalize="characters" spellcheck="false">
  </div>
  <button id="b">Entrar</button>
  <p class="erro" id="e"></p>
  <button type="button" class="troca" id="tr">Tenho um código de acesso</button>
</form>

async function chavePbk(segredo, sal){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(segredo), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt:sal, iterations:VOLTAS}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
}
async function abrirSite(k64){
  const k = await crypto.subtle.importKey("raw", de64(k64), "AES-GCM", false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:de64(SITE.i)}, k, de64(SITE.c)));
}

async function peloArquivo(t, pin){
  const s0 = t.replace(/[^A-Za-z0-9+/=.]/g, "");
  const pedacos = s0.split("AVALIACAO1.").slice(1).filter(Boolean);
  if(!pedacos.length) throw new Error("Isto não parece o arquivo da avaliação.");
  let p = null, cortado = false, pinErrado = false;
  for(const pd of pedacos){
    let x; try{ x = JSON.parse(atob(pd.replace(/\.+$/, ""))); }catch(_){ cortado = true; continue; }
    try{ const c = await crypto.subtle.decrypt({name:"AES-GCM", iv:de64(x.i)}, await chavePbk(pin, de64(x.s)), de64(x.c));
         const q = JSON.parse(new TextDecoder().decode(c)), qt = q.salvo ? q.salvo.quando : (q.criado || 0);
         if(!p || qt > (p.salvo ? p.salvo.quando : (p.criado || 0))) p = q; }
    catch(_){ pinErrado = true; }
  }
  if(!p) throw new Error(pinErrado ? "O PIN não confere com este arquivo." : "O texto do arquivo veio cortado. Cole de novo, inteiro.");
  if(p.ate && Date.now() > p.ate) throw new Error("Este arquivo venceu. Peça um novo.");
  if(!p.k) throw new Error("Este arquivo é antigo e não abre aqui. Peça um novo.");
  let html; try{ html = await abrirSite(p.k); }catch(_){ throw new Error("Este arquivo é de outra versão do formulário. Peça um novo."); }
  return {html, porta:{pacote:p, modelo:p.modelo, pin}};
}
async function peloCodigo(cod){
  for(const x of CODIGOS){
    try{ const k = new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv:de64(x.i)}, await chavePbk(cod, de64(x.s)), de64(x.c)));
      let b = ""; k.slice(0, 32).forEach(v => b += String.fromCharCode(v));
      return {html: await abrirSite(btoa(b)), porta:{modelo:new TextDecoder().decode(k.slice(32))}}; }catch(_){}
  }
  throw new Error("Código não confere.");
}
$("ba").onclick = () => $("fa").click();
$("fa").onchange = async () => { const f = $("fa").files[0]; if(!f) return; texto = await f.text(); $("na").textContent = f.name; $("tx").value = ""; $("pin").focus(); };
$("tx").oninput = () => { texto = $("tx").value; $("na").textContent = "nenhum escolhido"; };
$("tr").onclick = () => { const cod = $("mCod").hidden; $("mCod").hidden = !cod; $("mArq").hidden = cod;
  $("tr").textContent = cod ? "Tenho o arquivo e o PIN" : "Tenho um código de acesso"; $("e").textContent = ""; (cod ? $("c") : $("pin")).focus(); };
$("f").onsubmit = async ev => {
  ev.preventDefault();
  const b = $("b"), e = $("e"); e.textContent = "";
  const porCodigo = !$("mCod").hidden;
  if(porCodigo && !norm($("c").value)){ e.textContent = "Digite o código."; return; }
  if(!porCodigo && !texto.trim()){ e.textContent = "Escolha o arquivo ou cole o texto."; return; }
  if(!porCodigo && !norm($("pin").value)){ e.textContent = "Digite o PIN."; return; }
  b.disabled = true; b.textContent = "Conferindo…";
  try{
    const r = porCodigo ? await peloCodigo(norm($("c").value)) : await peloArquivo(texto, norm($("pin").value));
    window.__PORTA = r.porta;
    document.open(); document.write(r.html); document.close();
  }catch(x){ b.disabled = false; b.textContent = "Entrar"; e.textContent = x.message; }
};
})();
