<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Formulário de avaliação domiciliar</title>
<style>
:root{--papel:#fbfaf7;--cartao:#fff;--tinta:#1d2420;--apagado:#6b746f;--linha:#d9dcd6;--verde:#2f8f5b;--erro:#b3413b}
@media (prefers-color-scheme: dark){:root{--papel:#141816;--cartao:#1c211e;--tinta:#e8ece9;--apagado:#9aa49e;--linha:#333b36;--verde:#4fb47d;--erro:#e0736b}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--papel);color:var(--tinta);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
form{width:100%;max-width:380px;background:var(--cartao);border:1px solid var(--linha);border-radius:16px;padding:28px 24px}
h1{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
p{margin:0 0 20px;color:var(--apagado);font-size:14.5px}
label{display:block;font-size:13px;font-weight:650;margin:0 0 6px}
input{width:100%;font:inherit;font-size:18px;letter-spacing:.08em;text-transform:uppercase;padding:12px 14px;
  border:1px solid var(--linha);border-radius:10px;background:var(--papel);color:var(--tinta)}
input:focus{outline:2px solid var(--verde);outline-offset:1px}
button{width:100%;margin-top:14px;border:0;border-radius:10px;padding:13px;font:inherit;font-weight:700;
  background:var(--verde);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.erro{color:var(--erro);font-size:14px;min-height:1.3em;margin:10px 0 0}
</style></head><body>
<form id="f" autocomplete="off">
  <h1>Formulário de avaliação</h1>
  <p>Digite o código de acesso que você recebeu.</p>
  <label for="c">Código de acesso</label>
  <input id="c" autocomplete="off" autocapitalize="characters" spellcheck="false" autofocus>
  <button id="b">Entrar</button>
  <p class="erro" id="e"></p>
</form>

const de64 = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
async function abrir(codigo){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(codigo), "PBKDF2", false, ["deriveKey"]);
  for(const x of COFRES){
    const chave = await crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt:de64(x.s), iterations:VOLTAS},
      base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    try{
      const claro = await crypto.subtle.decrypt({name:"AES-GCM", iv:de64(x.i)}, chave, de64(x.c));
      return new TextDecoder().decode(claro);
